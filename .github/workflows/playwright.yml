name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'
  POSTGRES_VERSION: '16'

jobs:
  # ============================================================================
  # Job 1: Code Quality & Formatting
  # ============================================================================
  format-check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Check backend formatting (Checkstyle)
        run: mvn compile checkstyle:check
        working-directory: backend
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Lint frontend (Oxlint)
        run: npm run lint
        working-directory: frontend
      
      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend

  # ============================================================================
  # Job 2: Backend Unit & Integration Tests
  # ============================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: icu_chart_test
          POSTGRES_USER: icu_user
          POSTGRES_PASSWORD: icu_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Run unit tests with coverage
        run: mvn clean test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/icu_chart_test
          SPRING_DATASOURCE_USERNAME: icu_user
          SPRING_DATASOURCE_PASSWORD: icu_pass
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # Job 3: Backend Integration Tests (Testcontainers)
  # ============================================================================
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: icu_chart_test
          POSTGRES_USER: icu_user
          POSTGRES_PASSWORD: icu_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Run integration tests
        run: mvn test -Pintegration-test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/icu_chart_test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/icu_chart_test
          SPRING_DATASOURCE_USERNAME: icu_user
          SPRING_DATASOURCE_PASSWORD: icu_pass
      
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-integration-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # Job 4: Frontend Unit Tests
  # ============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Run unit tests
        run: npm test
        working-directory: frontend
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7
      
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # ============================================================================
  # Job 5: E2E Tests (Playwright)
  # ============================================================================
  e2e-test:
    name: E2E Tests (Playwright)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: my_fullstack_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      
      - name: Build backend
        run: mvn clean package -DskipTests
        working-directory: backend
      
      - name: Start backend
        run: |
          java -jar target/patient-chart-backend-*.jar &
          echo "Waiting for backend..."
          timeout 60 bash -c 'until curl -s http://localhost:8085/api/auth/login > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready"
        working-directory: backend
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      
      - name: Start frontend preview
        run: |
          npx vite preview --port 5173 &
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -s http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready"
        working-directory: frontend
      
      - name: Install Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: tests
      
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: tests/test-results/
          retention-days: 7

  # ============================================================================
  # Job 6: Build & Deploy (only on main branch push)
  # ============================================================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [format-check, backend-test, backend-integration, frontend-test, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build backend JAR
        run: mvn clean package -DskipTests
        working-directory: backend
      
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
      
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/patient-chart-backend-*.jar
          retention-days: 30
      
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30
