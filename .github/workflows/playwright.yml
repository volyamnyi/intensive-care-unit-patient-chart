name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '22'
  POSTGRES_VERSION: '16'

jobs:
  # ============================================================================
  # Job 1: Code Quality & Formatting
  # ============================================================================
  format-check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Check backend formatting (Checkstyle)
        run: mvn compile checkstyle:check
        working-directory: backend
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Lint frontend (Oxlint)
        run: npm run lint
        working-directory: frontend
      
      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend

  # ============================================================================
  # Job 2: Backend Unit & Integration Tests
  # ============================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: icu_chart_test
          POSTGRES_USER: icu_user
          POSTGRES_PASSWORD: icu_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Create application databases
        run: |
          for db in my_fullstack_core my_fullstack_icu my_fullstack_med my_fullstack_prosth; do
            if ! PGPASSWORD=icu_pass psql -h localhost -U icu_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
              PGPASSWORD=icu_pass psql -h localhost -U icu_user -d postgres -c "CREATE DATABASE $db"
            fi
          done
      
      - name: Run unit tests with coverage
        run: mvn clean test
        working-directory: backend
        env:
          APP_DATASOURCE_CORE_URL: jdbc:postgresql://localhost:5432/my_fullstack_core
          APP_DATASOURCE_CORE_USERNAME: icu_user
          APP_DATASOURCE_CORE_PASSWORD: icu_pass
          APP_DATASOURCE_ICU_URL: jdbc:postgresql://localhost:5432/my_fullstack_icu
          APP_DATASOURCE_ICU_USERNAME: icu_user
          APP_DATASOURCE_ICU_PASSWORD: icu_pass
          APP_DATASOURCE_MED_URL: jdbc:postgresql://localhost:5432/my_fullstack_med
          APP_DATASOURCE_MED_USERNAME: icu_user
          APP_DATASOURCE_MED_PASSWORD: icu_pass
          APP_DATASOURCE_PROSTH_URL: jdbc:postgresql://localhost:5432/my_fullstack_prosth
          APP_DATASOURCE_PROSTH_USERNAME: icu_user
          APP_DATASOURCE_PROSTH_PASSWORD: icu_pass
          APP_JWT_SECRET: zy2uR55T1CQamXMhsn63oZ6XcsSP6UpuN0Ob4T8s_nnITHNxtvCyvFK_VzFm4wyU

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/common/target/site/jacoco/
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: backend/*/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # Job 3: Backend Integration Tests (Testcontainers)
  # ============================================================================
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: icu_chart_test
          POSTGRES_USER: icu_user
          POSTGRES_PASSWORD: icu_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U icu_user; then
              echo "PostgreSQL is ready";
              break;
            fi
            echo "Waiting for PostgreSQL...";
            sleep 2;
          done
      
      - name: Create application databases
        run: |
          for db in my_fullstack_core my_fullstack_icu my_fullstack_med my_fullstack_prosth; do
            if ! PGPASSWORD=icu_pass psql -h localhost -U icu_user -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
              PGPASSWORD=icu_pass psql -h localhost -U icu_user -d postgres -c "CREATE DATABASE $db"
            fi
          done
      
      - name: Run integration tests
        run: mvn test -Pintegration-test
        working-directory: backend
        env:
          APP_DATASOURCE_CORE_URL: jdbc:postgresql://localhost:5432/my_fullstack_core
          APP_DATASOURCE_CORE_USERNAME: icu_user
          APP_DATASOURCE_CORE_PASSWORD: icu_pass
          APP_DATASOURCE_ICU_URL: jdbc:postgresql://localhost:5432/my_fullstack_icu
          APP_DATASOURCE_ICU_USERNAME: icu_user
          APP_DATASOURCE_ICU_PASSWORD: icu_pass
          APP_DATASOURCE_MED_URL: jdbc:postgresql://localhost:5432/my_fullstack_med
          APP_DATASOURCE_MED_USERNAME: icu_user
          APP_DATASOURCE_MED_PASSWORD: icu_pass
          APP_DATASOURCE_PROSTH_URL: jdbc:postgresql://localhost:5432/my_fullstack_prosth
          APP_DATASOURCE_PROSTH_USERNAME: icu_user
          APP_DATASOURCE_PROSTH_PASSWORD: icu_pass
          APP_JWT_SECRET: zy2uR55T1CQamXMhsn63oZ6XcsSP6UpuN0Ob4T8s_nnITHNxtvCyvFK_VzFm4wyU

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-integration-results
          path: backend/*/target/surefire-reports/
          retention-days: 7

  # ============================================================================
  # Job 4: Frontend Unit Tests
  # ============================================================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Run unit tests
        run: npm test
        working-directory: frontend
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 7
      
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # ============================================================================
  # Job 5: E2E Tests (Playwright)
  # ============================================================================
  e2e-test:
    name: E2E Tests (Playwright)
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    # Secrets live in the APP environment (environment-scoped secrets only
    # resolve when the job declares it).
    environment: APP
    # Test-user credentials are dynamic: every spec/helper reads them via
    # testUser(slot) from APP_TEST_USERNAME* / APP_TEST_PASSWORD*. Values come
    # from repository secrets (masked in logs); nothing is hardcoded here.
    # Job-level so BOTH "Start backend" (UserSeedService) and
    # "Run Playwright tests" (testUser helper) inherit them.
    env:
      APP_TEST_USERNAME1: ${{ secrets.APP_TEST_USERNAME1 }}
      APP_TEST_PASSWORD1: ${{ secrets.APP_TEST_PASSWORD1 }}
      APP_TEST_USERNAME2: ${{ secrets.APP_TEST_USERNAME2 }}
      APP_TEST_PASSWORD2: ${{ secrets.APP_TEST_PASSWORD2 }}
      APP_TEST_USERNAME3: ${{ secrets.APP_TEST_USERNAME3 }}
      APP_TEST_PASSWORD3: ${{ secrets.APP_TEST_PASSWORD3 }}
      APP_TEST_USERNAME4: ${{ secrets.APP_TEST_USERNAME4 }}
      APP_TEST_PASSWORD4: ${{ secrets.APP_TEST_PASSWORD4 }}
      APP_TEST_USERNAME5: ${{ secrets.APP_TEST_USERNAME5 }}
      APP_TEST_PASSWORD5: ${{ secrets.APP_TEST_PASSWORD5 }}
      APP_TEST_USERNAME6: ${{ secrets.APP_TEST_USERNAME6 }}
      APP_TEST_PASSWORD6: ${{ secrets.APP_TEST_PASSWORD6 }}
      APP_TEST_USERNAME7: ${{ secrets.APP_TEST_USERNAME7 }}
      APP_TEST_PASSWORD7: ${{ secrets.APP_TEST_PASSWORD7 }}
      APP_TEST_USERNAME8: ${{ secrets.APP_TEST_USERNAME8 }}
      APP_TEST_PASSWORD8: ${{ secrets.APP_TEST_PASSWORD8 }}
      APP_TEST_USERNAME9: ${{ secrets.APP_TEST_USERNAME9 }}
      APP_TEST_PASSWORD9: ${{ secrets.APP_TEST_PASSWORD9 }}
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: my_fullstack_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      
      - name: Create application databases
        run: |
          for db in my_fullstack_core my_fullstack_icu my_fullstack_med my_fullstack_prosth; do
            if ! PGPASSWORD=admin psql -h localhost -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
              PGPASSWORD=admin psql -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
            fi
          done
      
      - name: Build backend
        run: mvn clean package -DskipTests
        working-directory: backend

      - name: Start backend
        run: |
          java -jar app/target/app-*.jar &
          echo "Waiting for backend..."
          timeout 180 bash -c 'until curl -s http://localhost:8085/api/auth/login > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready"
        working-directory: backend
        env:
          APP_SCHEDULING_SIGNING_WINDOW_ENABLED: "false"
          APP_DATASOURCE_CORE_URL: jdbc:postgresql://localhost:5432/my_fullstack_core
          APP_DATASOURCE_CORE_USERNAME: postgres
          APP_DATASOURCE_CORE_PASSWORD: admin
          APP_DATASOURCE_ICU_URL: jdbc:postgresql://localhost:5432/my_fullstack_icu
          APP_DATASOURCE_ICU_USERNAME: postgres
          APP_DATASOURCE_ICU_PASSWORD: admin
          APP_DATASOURCE_MED_URL: jdbc:postgresql://localhost:5432/my_fullstack_med
          APP_DATASOURCE_MED_USERNAME: postgres
          APP_DATASOURCE_MED_PASSWORD: admin
          APP_DATASOURCE_PROSTH_URL: jdbc:postgresql://localhost:5432/my_fullstack_prosth
          APP_DATASOURCE_PROSTH_USERNAME: postgres
          APP_DATASOURCE_PROSTH_PASSWORD: admin
          # Real MIS API is the sole patient/user/department source — no mock, no fallback.
          # Values come from repository secrets; masked in CI logs, never read by agents.
          APP_MIS_API_BASE_URL: ${{ secrets.APP_MIS_API_BASE_URL }}
          APP_MIS_API_TOKEN_PATH: ${{ secrets.APP_MIS_API_TOKEN_PATH }}
          APP_MIS_API_RUN_PATH: ${{ secrets.APP_MIS_API_RUN_PATH }}
          APP_MIS_API_LOGIN: ${{ secrets.APP_MIS_API_LOGIN }}
          APP_MIS_API_PASSWORD: ${{ secrets.APP_MIS_API_PASSWORD }}
          APP_MIS_API_INSTALLATION_GUID: ${{ secrets.APP_MIS_API_INSTALLATION_GUID }}
          APP_JWT_SECRET: zy2uR55T1CQamXMhsn63oZ6XcsSP6UpuN0Ob4T8s_nnITHNxtvCyvFK_VzFm4wyU
          # Seed-user profile metadata (UserSeedService; logins/passwords come
          # from the job-level env above — never hardcoded).
          APP_TEST_USERFULLNAME: РћР»РµРєСЃР°РЅРґСЂ РњРµР»СЊРЅРёРє
          APP_TEST_PHONE1: +380501111111
          APP_TEST_PROFESSION1: Р›С–РєР°СЂ-С…С–СЂСѓСЂРі
          APP_TEST_USERROLE1: DOCTOR
          APP_TEST_USERFULLNAME2: РќР°С‚Р°Р»С–СЏ Р‘РѕР№РєРѕ
          APP_TEST_PHONE2: +380502222222
          APP_TEST_PROFESSION2: Р›С–РєР°СЂ-С…С–СЂСѓСЂРі
          APP_TEST_USERROLE2: DOCTOR
          APP_TEST_USERFULLNAME3: РћР»РµРЅР° РўРєР°С‡РµРЅРєРѕ
          APP_TEST_PHONE3: +380503333333
          APP_TEST_PROFESSION3: РњРµРґРёС‡РЅР° СЃРµСЃС‚СЂР° СЃС‚Р°С†С–РѕРЅР°СЂСѓ
          APP_TEST_USERROLE3: NURSE
          APP_TEST_USERFULLNAME4: РњР°СЂС–СЏ РљСЂР°РІС‡СѓРє
          APP_TEST_PHONE4: +380504444444
          APP_TEST_PROFESSION4: РњРµРґРёС‡РЅР° СЃРµСЃС‚СЂР° СЃС‚Р°С†С–РѕРЅР°СЂСѓ
          APP_TEST_USERROLE4: NURSE
          APP_TEST_USERFULLNAME5: Р’Р°СЃРёР»СЊ Р“РѕРЅС‡Р°СЂСѓРє
          APP_TEST_PHONE5: +380505555555
          APP_TEST_PROFESSION5: Р—Р°РІС–РґСѓРІР°С‡
          APP_TEST_USERROLE5: HEAD_OF_DEPARTMENT
          APP_TEST_USERFULLNAME6: РђРґРјС–РЅ РЎРёСЃС‚РµРјРё
          APP_TEST_PHONE6: +380506666666
          APP_TEST_PROFESSION6: РђРґРјС–РЅС–СЃС‚СЂР°С‚РѕСЂ
          APP_TEST_USERROLE6: ADMINISTRATOR
          APP_TEST_USERFULLNAME7: РћР»РµРі Р РѕРјР°РЅСЋРє
          APP_TEST_PHONE7: +380507777777
          APP_TEST_PROFESSION7: РџСЂРѕС‚РµР·РёСЃС‚
          APP_TEST_USERROLE7: PROSTHETIST
          APP_TEST_USERFULLNAME8: Р†СЂРёРЅР° РЁРµРІС‡СѓРє
          APP_TEST_PHONE8: +380508888888
          APP_TEST_PROFESSION8: РџСЂРѕС‚РµР·РёСЃС‚
          APP_TEST_USERROLE8: PROSTHETIST
          APP_TEST_USERFULLNAME9: РўР°СЂР°СЃ РњРµР»СЊРЅРёРє
          APP_TEST_PHONE9: +380509999999
          APP_TEST_PROFESSION9: РђРґРјС–РЅС–СЃС‚СЂР°С‚РѕСЂ РїСЂРѕС‚РµР·СѓРІР°РЅРЅСЏ
          APP_TEST_USERROLE9: PROSTHETICS_ADMINISTRATOR

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      
      - name: Start frontend preview
        run: |
          npx vite preview --port 5173 &
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -s http://localhost:5173 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready"
        working-directory: frontend
      
      - name: Fix Stuck Ubuntu Repositories
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu 24.04 (noble) runners resolve their Ubuntu
          # mirror through an APT *mirrorlist*, not a fixed URI: the deb822
          # file /etc/apt/sources.list.d/ubuntu.sources points at
          # `mirror+file:/etc/apt/apt-mirrors.txt`, and that mirrorlist ranks
          # azure.archive.ubuntu.com first (priority:1). That Azure mirror
          # intermittently throttles/stalls, freezing `apt-get update` and
          # therefore `npx playwright install --with-deps` for many minutes
          # (observed 35-minute install on run 32262539145).
          #
          # `sed` on the .sources files is NOT enough here вЂ” APT re-reads the
          # mirrorlist on every invocation and re-selects the Azure mirror.
          # The authoritative override is rewriting the mirrorlist file itself
          # so archive.ubuntu.com (Canonical) is the only host APT may use.
          # `printf` is required: the spec needs a literal TAB between URI and
          # `priority:N`, which a quoted echo would escape literally.
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
            | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          echo "=== /etc/apt/apt-mirrors.txt (pinned) ==="; cat /etc/apt/apt-mirrors.txt
          # Belt-and-suspenders: also rewrite any classic/deb822 URIs that
          # still hard-code the Azure mirror, in case the image layout differs.
          sudo sed -Ei 's|https?://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/*.sources || true
          sudo sed -Ei 's|https?://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list || true
          sudo rm -f /var/lib/apt/lists/partial/mirrorlist-* 2>/dev/null || true
          sudo apt-get update

      - name: Install Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: tests
      
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: tests
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: tests/test-results/
          retention-days: 7

  # ============================================================================
  # Job 6: Build & Deploy (only on main branch push)
  # ============================================================================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [format-check, backend-test, backend-integration, frontend-test, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Build backend JAR
        run: mvn clean package -DskipTests
        working-directory: backend
      
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
      
      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/app/target/app-*.jar
          retention-days: 30
      
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

