name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: my_fullstack_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Run backend unit tests
        working-directory: backend
        run: mvn -B test

      - name: Build backend JAR
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Install Playwright browsers
        working-directory: tests
        run: npm install && npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        env:
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: 'true'
          SPRING_SQL_INIT_MODE: always
        run: |
          nohup java -jar target/patient-chart-backend-1.0.0.jar > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/api/auth/login || true)
            if [ "$code" != "000" ] && [ "$code" != "404" ]; then
              echo "Backend responded with HTTP $code"; break
            fi
            sleep 3
          done
          echo "--- backend.log tail ---"; tail -n 20 /tmp/backend.log

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || true)
            if [ "$code" != "000" ]; then
              echo "Frontend responded with HTTP $code"; break
            fi
            sleep 2
          done

      - name: Run E2E tests
        working-directory: tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
