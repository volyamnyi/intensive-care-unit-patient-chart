server:
  port: 8085

spring:
  data:
    jpa:
      repositories:
        enabled: false

  sql:
    init:
      mode: never
      encoding: UTF-8

  liquibase:
    enabled: false

  mail:
    host: localhost
    port: 1025
    username: dev
    password: dev
    properties:
      mail:
        debug: true
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    serialization:
      fail-on-empty-beans: false
    deserialization:
      fail-on-null-for-primitives: false
    datatype:
      datetime:
        write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

app:
  jwt:
    secret: cGF0aWVudC1jaGFydC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI2
    expiration-ms: 86400000

  datasource:
    core:
      url: jdbc:postgresql://localhost:5432/my_fullstack_core
      username: postgres
      password: admin
      driver-class-name: org.postgresql.Driver
    icu:
      url: jdbc:postgresql://localhost:5432/my_fullstack_icu
      username: postgres
      password: admin
      driver-class-name: org.postgresql.Driver
    med:
      url: jdbc:postgresql://localhost:5432/my_fullstack_med
      username: postgres
      password: admin
      driver-class-name: org.postgresql.Driver
    prosth:
      url: jdbc:postgresql://localhost:5432/my_fullstack_prosth
      username: postgres
      password: admin
      driver-class-name: org.postgresql.Driver

  seed-data:
    enabled: true

  mis:
    mock-enabled: true
    wiremock-enabled: false

  api:
    title: ICU Patient Chart API
    description: API for Intensive Care Unit Patient Chart - Form 003-15/о electronic medical record system

  ldap:
    enabled: false

  scheduling:
    day-close-hour: 7
    escalation-hour: 9
    signing-window-start: 0
    signing-window-end: 23
    auto-create-prescriptions-enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: DEBUG

    # Application
    com.superhumans: TRACE

    # Spring
    org.springframework: DEBUG
    org.springframework.web: TRACE
    org.springframework.web.servlet: TRACE
    org.springframework.web.servlet.mvc.method.annotation: TRACE
    org.springframework.security: TRACE
    org.springframework.security.web: TRACE
    org.springframework.security.authentication: TRACE
    org.springframework.security.authorization: TRACE
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: TRACE

    # Hibernate / JPA
    org.hibernate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.hibernate.type.descriptor.sql: TRACE
    org.hibernate.type.descriptor.jdbc: TRACE
    org.hibernate.stat: DEBUG

    # JDBC / Hikari
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari.pool: DEBUG

    # PostgreSQL JDBC
    org.postgresql: DEBUG

    # Liquibase
    liquibase: DEBUG
    liquibase.changelog: TRACE
    liquibase.executor: TRACE

    # Jackson
    com.fasterxml.jackson: DEBUG

    # Mail
    org.springframework.mail: DEBUG
    org.eclipse.angus.mail: DEBUG
    jakarta.mail: DEBUG

    # AOP
    org.springframework.aop: TRACE
    org.springframework.aop.interceptor: TRACE

    # HTTP client/server
    org.apache.http: DEBUG
    org.apache.hc.client5.http: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  ssl:
    enabled: false
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12