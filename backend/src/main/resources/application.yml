server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/my_fullstack_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET client_encoding = 'UTF8'
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  mail:
    host: localhost
    port: 1025
    username: dev
    password: dev
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    date-format: yyyy-MM-dd'T'HH:mm:ss

app:
  jwt:
    secret: cGF0aWVudC1jaGFydC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi0yMDI2
    expiration-ms: 86400000
  mis:
    mock-enabled: true
    wiremock-enabled: false
  ldap:
    enabled: false
  scheduling:
    day-close-hour: 7
    escalation-hour: 9
    signing-window-start: 0
    signing-window-end: 23

logging:
  level:
    com.superhumans: DEBUG
    org.springframework.security: INFO
    org.springframework.web: DEBUG
    org.springframework.aop.interceptor: DEBUG
    org.springframework.orm.jpa: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

server:
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
